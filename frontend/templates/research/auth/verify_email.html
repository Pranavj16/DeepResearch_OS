{% extends "base.html" %}

{% block title %}Verify Email - DeepResearch OS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-surface-card border border-surface-border rounded-2xl p-8 shadow-2xl space-y-6 text-center">
    <div class="w-10 h-10 rounded-xl bg-surface-base border border-zinc-800 text-zinc-300 flex items-center justify-center mx-auto">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
    </div>
    
    <div class="space-y-1">
        <h1 class="text-xl font-bold text-zinc-100">Check Your Inbox</h1>
        <p class="text-xs text-zinc-400">We've sent a verification link to your email address. Click the link to complete account setup.</p>
    </div>

    <div class="p-3.5 bg-surface-base rounded-xl border border-zinc-800 text-xs text-zinc-300 font-mono">
        Status: <span class="text-zinc-200 font-medium uppercase">Pending Verification</span>
    </div>

    <div class="pt-2 flex justify-center">
        <a href="/login" class="px-5 py-2.5 rounded-xl bg-zinc-100 hover:bg-white text-black font-medium text-xs shadow-sm transition">Proceed to Sign In</a>
    </div>
</div>
{% endblock %}

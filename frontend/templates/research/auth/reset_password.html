{% extends "base.html" %}

{% block title %}Set New Password - DeepResearch OS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-surface-card border border-surface-border rounded-2xl p-8 shadow-2xl space-y-6">
    <div class="text-center space-y-1">
        <h1 class="text-xl font-bold text-zinc-100">Set New Password</h1>
        <p class="text-xs text-zinc-400">Choose a strong, secure password for your account.</p>
    </div>

    {% if error %}
    <div class="p-3 bg-zinc-900 border border-zinc-700 text-zinc-200 text-xs rounded-xl">
        {{ error }}
    </div>
    {% endif %}

    <form action="/reset-password" method="POST" class="space-y-4">
        {% csrf_token %}
        <input type="hidden" name="token" value="{{ request.GET.token }}">
        <div>
            <label class="block text-xs font-medium text-zinc-400 mb-1.5">New Password (min 8 chars)</label>
            <input type="password" name="password" minlength="8" required placeholder="••••••••••••" class="w-full bg-surface-base border border-zinc-800 rounded-xl px-4 py-2.5 text-xs text-zinc-100 focus:outline-none focus:border-zinc-500 transition">
        </div>
        <div>
            <label class="block text-xs font-medium text-zinc-400 mb-1.5">Confirm New Password</label>
            <input type="password" name="confirm_password" minlength="8" required placeholder="••••••••••••" class="w-full bg-surface-base border border-zinc-800 rounded-xl px-4 py-2.5 text-xs text-zinc-100 focus:outline-none focus:border-zinc-500 transition">
        </div>
        <button type="submit" class="w-full py-2.5 rounded-xl bg-zinc-100 hover:bg-white text-black font-medium text-xs shadow-sm transition">Update Password & Sign In</button>
    </form>
</div>
{% endblock %}

version: "3.8"

services:
  nginx:
    image: nginx:alpine
    container_name: research_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - research_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: research_backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - POSTGRES_SERVER=postgres
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - research_net

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: research_frontend
    restart: always
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - research_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: research_worker
    command: ["uv", "run", "python", "-m", "app.worker.runner"]
    restart: always
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - research_net

  postgres:
    image: postgres:16-alpine
    container_name: research_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: research_assistant
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - research_net

  redis:
    image: redis:7-alpine
    container_name: research_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - research_net

  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: research_qdrant
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "cat /dev/null > /dev/tcp/localhost/6333"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - research_net

networks:
  research_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

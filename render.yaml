services:
  # 1. FastAPI Backend Service (100% FREE TIER)
  - type: web
    name: research-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: uv sync --frozen
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production

      # Default Provider & Model
      - key: DEFAULT_PROVIDER
        value: gemini
      - key: DEFAULT_MODEL
        value: gemini-2.5-flash

      # AI Provider Keys
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        value: ""
      - key: NVIDIA_API_KEY
        value: ""
      - key: OPENROUTER_API_KEY
        value: ""

      # Search & Crawling Keys
      - key: TAVILY_API_KEY
        value: ""
      - key: FIRECRAWL_API_KEY
        value: ""

      # Database, Cache & Vector Store
      - key: DATABASE_URL
        value: ""
      - key: REDIS_URL
        value: ""
      - key: QDRANT_URL
        value: ""
      - key: QDRANT_API_KEY
        value: ""

      # Security
      - key: SECRET_KEY
        generateValue: true

  # 2. Django Frontend Web App (100% FREE TIER)
  - type: web
    name: research-frontend
    env: python
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: pip install -r requirements.txt || pip install django htmx-django requests gunicorn
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: research-backend
          property: host
      - key: SECRET_KEY
        generateValue: true

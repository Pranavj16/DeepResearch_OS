[alembic]
script_location = migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
timezone = UTC
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/research_assistant

[post_write_hooks]

[logging]
default_level = INFO
